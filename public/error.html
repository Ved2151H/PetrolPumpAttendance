<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>No Internet Connection</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f9fafb;
            color: #1f2937;
            text-align: center;
            padding: 20px;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 16px;
            color: #9ca3af;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        p {
            font-size: 16px;
            color: #4b5563;
            margin-bottom: 24px;
        }
        button {
            background-color: #16a34a;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        button:active {
            background-color: #15803d;
        }
    </style>
</head>
<body>
    <div class="icon">📡</div>
    <h1>No Internet Connection</h1>
    <p>Please turn on Wi-Fi or mobile data and try again.</p>
    <button onclick="retry()">Retry</button>

    <script>
        function retry() {
            // Attempt to reload the last visited URL
            // Capacitor stores it sometimes, but we can just reload the main url
            window.location.href = "https://petrol-pump-attendance.vercel.app";
        }
    </script>
</body>
</html>
